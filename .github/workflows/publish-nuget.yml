name: Publish NuGet Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/ESBuild.AspNetCore/ESBuild.AspNetCore.csproj'
          $propertyGroups = @($project.Project.PropertyGroup)
          $upstream = ($propertyGroups | Where-Object { $_.ESBuildUpstreamVersion } | Select-Object -First 1).ESBuildUpstreamVersion
          $wrapper = ($propertyGroups | Where-Object { $_.ESBuildWrapperRevision -ne $null } | Select-Object -First 1).ESBuildWrapperRevision

          if ([string]::IsNullOrWhiteSpace($wrapper)) {
            $version = $upstream
          }
          else {
            $version = "$upstream.$wrapper"
          }

          "upstream_version=$upstream" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build ESBuild.AspNetCore.slnx -c Release

      - name: Run unit tests
        run: dotnet test ESBuild.AspNetCore.slnx -c Release --no-build

      - name: Pack package
        run: dotnet pack src/ESBuild.AspNetCore/ESBuild.AspNetCore.csproj -c Release --no-build -o artifacts/packages

      - name: Run smoke tests
        shell: pwsh
        run: >
          ./tests/Run-SmokeTests.ps1
          -PackageVersion "${{ steps.version.outputs.package_version }}"
          -UpstreamVersion "${{ steps.version.outputs.upstream_version }}"
          -PackageFeed "${{ github.workspace }}/artifacts/packages"

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet.org
        id: nuget_push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json"

      - name: Create GitHub release and upload NuGet package
        if: success() && steps.nuget_push.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.package_version }}
          name: v${{ steps.version.outputs.package_version }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
